<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Продукты</title>
<meta name="theme-color" content="#F3F1FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14122A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Продукты">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#F3F1FA; --surface:#FFFFFF; --ink:#1E1B3A; --muted:#6F6C8C;
  --line:#E4E0F3; --chip:#E8E4F6; --accent:#E5472E;
  --font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14122A; --surface:#201D40; --ink:#F1EFFF; --muted:#9B98BD; --line:#312E57; --chip:#2A2750}
}
:root[data-theme=light]{color-scheme:light;--bg:#F3F1FA;--surface:#FFFFFF;--ink:#1E1B3A;--muted:#6F6C8C;--line:#E4E0F3;--chip:#E8E4F6}
:root[data-theme=dark]{color-scheme:dark;--bg:#14122A;--surface:#201D40;--ink:#F1EFFF;--muted:#9B98BD;--line:#312E57;--chip:#2A2750}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{height:100dvh;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
button,input,textarea,label,[data-recipe]{touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#app{position:relative;height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column}

/* header */
header{padding:16px 20px 4px}
.top{display:flex;align-items:flex-start;gap:8px}
.top .ttl{flex:1;min-width:0}
.acts{display:flex;gap:8px}
h1{margin:0;font-size:40px;line-height:1.05;font-weight:800;letter-spacing:-.03em}
.stats{margin:6px 0 0;color:var(--muted);font-size:15px;font-weight:600}
.iconbtn{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--chip);display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar{height:6px;border-radius:99px;background:var(--line);margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .45s ease}

/* chips */
.filters,.pick{display:flex;align-items:center;gap:8px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar,.pick::-webkit-scrollbar{display:none}
.filters{padding:12px 20px 8px}
.filters:empty{display:none}
.chip{flex:none;border:0;border-radius:99px;padding:0 14px;min-height:38px;font-size:15px;font-weight:600;background:var(--chip);display:inline-flex;align-items:center;gap:7px}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted))}
.chip b{font-weight:700;opacity:.6}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.chip.sm{min-height:34px;font-size:14px;padding:0 12px}
.chip.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line);color:var(--muted)}
.lbl{flex:none;color:var(--muted);font-size:14px;font-weight:600}

/* content */
main{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:12px 16px 24px}
.group{margin:0 0 20px}
.group h2{margin:0 4px 8px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.group h2 .dot{width:12px;height:12px;border-radius:50%;background:var(--c)}
.group h2 small{margin-left:auto;color:var(--muted);font-size:14px;font-weight:600}
.group .chips{margin:0}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:22px;overflow:hidden}
.group li+li{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;
  min-height:64px;padding:6px 4px 6px 16px;cursor:pointer;-webkit-user-select:none;user-select:none}
.check{width:32px;height:32px;padding:0;border-radius:50%;border:2.5px solid var(--c);background:transparent;display:grid;place-items:center;transition:background .2s}
.check svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .25s .05s}
.row.done .check{background:var(--c)}
.row.done .check svg{stroke-dashoffset:0}
.nm{font-size:18px;font-weight:600;line-height:1.25;word-break:break-word}
.qty{display:block;margin-top:2px;font-size:14px;font-weight:500;color:var(--muted)}
.qty .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:6px}
.row.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--c)}
.row.done .qty{opacity:.7}
.more{flex:none;width:48px;height:48px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center}
.more svg{width:22px;height:22px;fill:currentColor}
.more.add{color:var(--accent)}
.clear{display:block;margin:4px auto 0;border:0;background:transparent;color:var(--muted);font-size:15px;font-weight:700;padding:12px 16px}

.hrow{display:flex;align-items:center;gap:10px;min-height:64px;padding:6px 4px 6px 16px}
.hrow>div{flex:1;min-width:0}
.rrow{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:10px 16px;border:0;background:transparent;text-align:left}
.rrow>div{flex:1;min-width:0}
.cnt{flex:none;min-width:30px;height:30px;padding:0 9px;border-radius:15px;background:var(--chip);display:grid;place-items:center;font-size:14px;font-weight:700;color:var(--muted)}
.arow{display:block;width:100%;min-height:64px;padding:12px 16px;border:0;background:transparent;text-align:left}
.arow.danger .nm{color:var(--accent)}
.foot{margin:0 4px 12px}

.empty{padding:56px 24px;text-align:center}
.empty h2{margin:0 0 8px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.empty p{margin:0 auto;max-width:300px;color:var(--muted);font-size:16px;line-height:1.45;font-weight:500}
.empty .btn{margin-top:22px}

.tip{display:flex;align-items:center;gap:12px;margin:0 0 16px;padding:12px 8px 12px 16px;border-radius:20px;background:var(--chip);font-size:15px;line-height:1.35;font-weight:500}
.tip span{flex:1}
.tip button{flex:none;border:0;background:var(--ink);color:var(--bg);border-radius:99px;min-height:38px;padding:0 14px;font-weight:700;font-size:14px}

/* composer + tabs */
.composer{padding:10px 16px 12px;background:var(--bg)}
.pick{padding:0 0 10px}
.field{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 20px;border-radius:30px;background:var(--surface);
  box-shadow:0 0 0 2px var(--line),0 10px 24px -14px rgba(30,27,58,.45)}
.field:focus-within{box-shadow:0 0 0 2px var(--accent),0 10px 24px -14px rgba(30,27,58,.45)}
.field input{flex:1;min-width:0;height:46px;border:0;outline:0;background:transparent;color:var(--ink);font:600 17px var(--font)}
.field input::placeholder{color:var(--muted);font-weight:500}
.addbtn{flex:none;width:46px;height:46px;border:0;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
.addbtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round}

.tabbar{display:flex;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.tab{flex:1;min-width:0;min-height:54px;padding:6px 0;border:0;border-radius:14px;background:transparent;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current=page]{color:var(--accent)}

/* toast */
.toast{position:absolute;left:16px;right:16px;bottom:var(--toast-b,120px);display:flex;align-items:center;gap:12px;
  padding:6px 8px 6px 18px;min-height:50px;border-radius:25px;background:var(--ink);color:var(--bg);font-size:15px;font-weight:600;
  opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .2s,transform .2s;z-index:5}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast span{flex:1;min-width:0}
.toast button{border:0;background:transparent;color:#FF8A73;font-weight:800;font-size:15px;min-height:40px;padding:0 12px;border-radius:99px}

/* sheets */
dialog{border:0;padding:0;width:100%;max-width:640px;max-height:90dvh;margin:auto auto 0;overflow:auto;
  border-radius:28px 28px 0 0;background:var(--bg);color:var(--ink);font-family:var(--font)}
dialog::backdrop{background:rgba(20,18,42,.55)}
.sheet{padding:22px 20px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 16px;font-size:24px;font-weight:800;letter-spacing:-.02em}
.f{display:block;margin:0 0 16px;font-size:14px;font-weight:600;color:var(--muted)}
.f input,.f textarea,.sheet .inp{display:block;width:100%;margin-top:6px;padding:0 16px;height:52px;border:0;border-radius:16px;outline:0;
  background:var(--surface);color:var(--ink);font:600 17px var(--font);box-shadow:0 0 0 2px var(--line)}
.f textarea{height:auto;min-height:170px;padding:14px 16px;resize:none;line-height:1.4}
.f input:focus,.f textarea:focus,.sheet .inp:focus{box-shadow:0 0 0 2px var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 20px}
.actions{display:flex;gap:10px}
.btn{height:52px;border:0;border-radius:26px;padding:0 22px;font-size:17px;font-weight:700;background:var(--chip)}
.btn.primary{flex:1;background:var(--accent);color:#fff}
.btn.danger{color:var(--accent)}
.btn:disabled{opacity:.5}
.sheet .text{margin:0 0 20px;color:var(--muted);font-size:16px;line-height:1.45;font-weight:500}
.srow{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.srow input{flex:1;min-width:0;height:52px;border:0;border-radius:16px;padding:0 16px;outline:0;background:var(--surface);color:var(--ink);font:600 17px var(--font);box-shadow:0 0 0 2px var(--line)}
.swatch{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--c);box-shadow:inset 0 0 0 3px var(--bg),0 0 0 2px var(--c)}
.x{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center}
.x svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.hint{margin:0 0 14px;color:var(--muted);font-size:15px;line-height:1.4;font-weight:500}
#storeForm{display:flex;gap:10px;margin:16px 0 18px}
#storeForm input{flex:1;min-width:0;margin:0}
#rIngs{margin:0 0 16px;padding:4px 16px;border-radius:18px;background:var(--surface)}
.ing{display:flex;align-items:center;gap:14px;padding:12px 0;font-size:17px}
.ing+.ing{border-top:1px solid var(--line)}
.ing input{flex:none;width:24px;height:24px;margin:0;accent-color:var(--accent)}
.ing .nm{flex:1;font-size:17px}
.ing .q2{color:var(--muted);font-size:15px;font-weight:500}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="top">
      <div class="ttl">
        <h1 id="title">Продукты</h1>
        <p class="stats" id="stats"></p>
      </div>
      <div class="acts" id="acts"></div>
    </div>
    <div class="bar" id="barBox"><i id="bar"></i></div>
  </header>

  <nav class="filters" id="filters" aria-label="Фильтр по магазинам"></nav>
  <main id="main"><div id="list"></div></main>

  <div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="undo" type="button" hidden>Отменить</button></div>

  <form class="composer" id="add" autocomplete="off">
    <div class="pick" id="pick"></div>
    <div class="field">
      <input id="item" type="text" placeholder="Что купить?" enterkeyhint="done" autocapitalize="sentences" autocorrect="on" maxlength="80" aria-label="Название продукта">
      <button class="addbtn" type="submit" aria-label="Добавить в список">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
  </form>

  <nav class="tabbar" id="tabs" aria-label="Разделы">
    <button class="tab" data-tab="list" type="button">
      <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.3 1.3L7 5M3.5 12l1.3 1.3L7 11M3.5 18l1.3 1.3L7 17"/></svg>Список
    </button>
    <button class="tab" data-tab="recipes" type="button">
      <svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>Рецепты
    </button>
    <button class="tab" data-tab="history" type="button">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>История
    </button>
    <button class="tab" data-tab="settings" type="button">
      <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Настройки
    </button>
  </nav>
</div>

<input type="file" id="importFile" accept=".json,application/json,text/plain" hidden>

<!-- Продукт -->
<dialog id="editDlg" aria-label="Изменить продукт">
  <form class="sheet" id="editForm" autocomplete="off">
    <h3>Продукт</h3>
    <label class="f">Название<input id="eItem" type="text" autocomplete="off" maxlength="80" required></label>
    <label class="f">Количество или заметка<input id="eQty" type="text" autocomplete="off" maxlength="60" placeholder="Например, 2 л или без лактозы"></label>
    <div class="f" style="margin-bottom:0">Магазин</div>
    <div class="chips" id="eStores"></div>
    <div class="actions">
      <button class="btn danger" type="button" id="eDel">Удалить</button>
      <button class="btn primary" type="submit" autofocus>Сохранить</button>
    </div>
  </form>
</dialog>

<!-- Магазины -->
<dialog id="storesDlg" aria-label="Магазины">
  <div class="sheet">
    <h3>Магазины</h3>
    <p class="hint">Необязательно: если указать магазин, список разделится на группы. Продукты без магазина остаются в общей группе.</p>
    <div id="storeList"></div>
    <form id="storeForm" autocomplete="off">
      <input class="inp" id="sShop" type="text" autocomplete="off" autocorrect="off" maxlength="40" placeholder="Название магазина" aria-label="Название нового магазина">
      <button class="btn" type="submit">Добавить</button>
    </form>
    <div class="actions"><button class="btn primary" type="button" id="storesDone" autofocus>Готово</button></div>
  </div>
</dialog>

<!-- Рецепт: просмотр -->
<dialog id="recipeDlg" aria-label="Рецепт">
  <div class="sheet">
    <h3 id="rTitle"></h3>
    <div id="rIngs"></div>
    <div class="actions">
      <button class="btn" type="button" id="rEdit">Изменить</button>
      <button class="btn primary" type="button" id="rAdd" autofocus>Добавить в список</button>
    </div>
  </div>
</dialog>

<!-- Рецепт: правка -->
<dialog id="recipeEditDlg" aria-label="Правка рецепта">
  <form class="sheet" id="recipeForm" autocomplete="off">
    <h3 id="reHead">Новый рецепт</h3>
    <label class="f">Название<input id="reTitle" type="text" autocomplete="off" maxlength="60" required placeholder="Например, паста с фаршем"></label>
    <label class="f">Ингредиенты<textarea id="reText" autocomplete="off" rows="7" maxlength="3000" placeholder="Макароны, 400 г&#10;Фарш, 300 г&#10;Томатная паста&#10;Сыр"></textarea></label>
    <p class="hint">По одному в строке. Количество можно написать после запятой: «Фарш, 300 г».</p>
    <div class="actions">
      <button class="btn danger" type="button" id="reDel" hidden>Удалить</button>
      <button class="btn primary" type="submit" autofocus>Сохранить</button>
    </div>
  </form>
</dialog>

<!-- Подтверждение -->
<dialog id="confirmDlg" aria-label="Подтверждение">
  <form class="sheet" method="dialog">
    <h3 id="cTitle"></h3>
    <p class="text" id="cText"></p>
    <div class="actions">
      <button class="btn" value="cancel">Отмена</button>
      <button class="btn primary" value="ok" id="cOk" autofocus></button>
    </div>
  </form>
</dialog>

<noscript>Для работы приложения нужен JavaScript.</noscript>

<script>
(() => {
'use strict';

const KEY = 'produkty.v1';
const TIP_KEY = 'produkty.tip';
const PALETTE = ['#E5472E', '#F0A010', '#2E8B57', '#3C5BD9', '#9B4FC9', '#E8648A', '#14A3A3', '#7B6A58'];
const NONE_COLOR = '#8C89AB';
const LOG_MAX = 500;

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const colorOk = c => typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c);

let state = load();
let tab = 'list';
let pick = null;               // магазин, выбранный в строке ввода (не сохраняется)
let undoSnap = null, toastTimer = 0, renderTimer = 0;
let fromComposer = false, editingId = null, editStore = null, recipeId = null, recipeEditId = null;

/* ---------- данные ---------- */
function normalize(s) {
  const out = { items: [], stores: [], view: 'all', log: [], recipes: [], theme: 'auto' };
  if (!s || typeof s !== 'object') return out;
  if (Array.isArray(s.stores)) {
    out.stores = s.stores.filter(x => x && x.id && x.name)
      .map(x => ({ id: String(x.id), name: String(x.name).slice(0, 40), color: colorOk(x.color) ? x.color : PALETTE[0] }));
  }
  if (Array.isArray(s.items)) {
    out.items = s.items.filter(x => x && x.id && x.name)
      .map(x => ({ id: String(x.id), name: String(x.name).slice(0, 80), qty: String(x.qty || '').slice(0, 60),
                   store: out.stores.some(st => st.id === x.store) ? x.store : null, done: !!x.done }));
  }
  if (Array.isArray(s.log)) {
    out.log = s.log.filter(x => x && x.name && Number(x.ts) > 0).slice(-LOG_MAX)
      .map(x => ({ id: String(x.id || uid()), item: String(x.item || ''), name: String(x.name).slice(0, 80),
                   store: x.store ? String(x.store).slice(0, 40) : null, color: colorOk(x.color) ? x.color : null, ts: Number(x.ts) }));
  }
  if (Array.isArray(s.recipes)) {
    out.recipes = s.recipes.filter(x => x && x.id && x.title)
      .map(x => ({ id: String(x.id), title: String(x.title).slice(0, 60), text: String(x.text || '').slice(0, 3000) }));
  }
  if (['auto', 'light', 'dark'].includes(s.theme)) out.theme = s.theme;
  return out;
}
function load() {
  try { return normalize(JSON.parse(localStorage.getItem(KEY))); } catch (e) { return normalize(null); }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}
const storeOf = id => state.stores.find(s => s.id === id);

function fixView() {
  const v = state.view;
  if (v === 'all') return;
  if (v === 'none' && state.stores.length) return;
  if (!storeOf(v)) state.view = 'all';
}

function applyTheme() {
  const root = document.documentElement;
  const metas = $$('meta[name=theme-color]');
  if (state.theme === 'auto') {
    root.removeAttribute('data-theme');
    if (metas[0]) metas[0].setAttribute('content', '#F3F1FA');
    if (metas[1]) metas[1].setAttribute('content', '#14122A');
  } else {
    root.setAttribute('data-theme', state.theme);
    metas.forEach(m => m.setAttribute('content', state.theme === 'dark' ? '#14122A' : '#F3F1FA'));
  }
}

function getGroups(view) {
  const it = state.items;
  const none = { id: null, name: 'Без магазина', color: NONE_COLOR, items: it.filter(i => !storeOf(i.store)) };
  let gs = state.stores.length
    ? [...state.stores.map(s => ({ id: s.id, name: s.name, color: s.color, items: it.filter(i => i.store === s.id) })), none]
    : [{ ...none, name: null }];
  if (view === 'none') gs = gs.filter(g => g.id === null);
  else if (view !== 'all') gs = gs.filter(g => g.id === view);
  gs = gs.map(g => ({ ...g, items: [...g.items.filter(i => !i.done), ...g.items.filter(i => i.done)] }));
  return view === 'all' ? gs.filter(g => g.items.length) : gs;
}

/* --- рецепты --- */
function parseIngredients(text) {
  return String(text).split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/^(.*?)\s*(?:[,;]|\s[—–-]\s)\s*(.+)$/);
    const name = m ? (m[1].trim() || l) : l;
    return { name: name.slice(0, 80), qty: m ? m[2].trim().slice(0, 60) : '' };
  }).slice(0, 60);
}

function renderRecipes() {
  const box = $('#list');
  if (!state.recipes.length) {
    box.innerHTML = `<div class="empty"><h2>Рецептов пока нет</h2><p>Сохраните блюдо с ингредиентами, а потом добавляйте их в список одним нажатием.</p><button class="btn primary" type="button" data-act="newrecipe">Добавить рецепт</button></div>`;
    return;
  }
  const rows = state.recipes.map(r => {
    const ing = parseIngredients(r.text);
    const prev = ing.slice(0, 4).map(i => i.name).join(', ') + (ing.length > 4 ? '…' : '');
    return `<li><button class="rrow" type="button" data-recipe="${r.id}"><div><span class="nm">${esc(r.title)}</span><span class="qty">${ing.length ? esc(prev) : 'Без ингредиентов'}</span></div><span class="cnt">${ing.length}</span></button></li>`;
  }).join('');
  box.innerHTML = `<section class="group"><ul>${rows}</ul></section>`;
}

/* --- история --- */
const dayKey = ts => { const d = new Date(ts); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); };
function dayLabel(ts) {
  const now = new Date(), d = new Date(ts), k = dayKey(ts);
  if (k === dayKey(now)) return 'Сегодня';
  const y = new Date(now); y.setDate(now.getDate() - 1);
  if (k === dayKey(y)) return 'Вчера';
  const opts = { day: 'numeric', month: 'long' };
  if (d.getFullYear() !== now.getFullYear()) opts.year = 'numeric';
  return d.toLocaleDateString('ru-RU', opts);
}
const timeLabel = ts => new Date(ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });

function renderHistory() {
  const box = $('#list');
  if (!state.log.length) {
    box.innerHTML = `<div class="empty"><h2>Пока пусто</h2><p>Когда вы отметите продукт купленным, он появится здесь, и его можно будет добавить в список снова.</p></div>`;
    return;
  }
  const map = new Map();
  for (const e of state.log) {
    const k = e.name.toLowerCase();
    const m = map.get(k) || { name: e.name, store: e.store, count: 0, last: 0 };
    m.count++;
    if (e.ts >= m.last) { m.last = e.ts; m.name = e.name; m.store = e.store; }
    map.set(k, m);
  }
  const freq = [...map.values()].filter(m => m.count > 1).sort((a, b) => b.count - a.count || b.last - a.last).slice(0, 8);
  let h = '';
  if (freq.length) {
    h += `<section class="group"><h2>Часто покупаете</h2><div class="chips">` + freq.map(m =>
      `<button class="chip" type="button" data-act="readd" data-name="${esc(m.name)}" data-store="${esc(m.store || '')}">${esc(m.name)} <b>×${m.count}</b></button>`).join('') + `</div></section>`;
  }
  const events = [...state.log].sort((a, b) => b.ts - a.ts).slice(0, 200);
  let key = null, rows = '', label = '';
  const flush = () => { if (rows) h += `<section class="group"><h2>${esc(label)}</h2><ul>${rows}</ul></section>`; rows = ''; };
  for (const e of events) {
    const k = dayKey(e.ts);
    if (k !== key) { flush(); key = k; label = dayLabel(e.ts); }
    const where = e.store ? `<i class="dot" style="--c:${e.color || NONE_COLOR}"></i>${esc(e.store)}, ` : '';
    rows += `<li class="hrow"><div><span class="nm">${esc(e.name)}</span><span class="qty">${where}${timeLabel(e.ts)}</span></div>
      <button class="more add" type="button" data-act="readd" data-name="${esc(e.name)}" data-store="${esc(e.store || '')}" aria-label="Добавить снова: ${esc(e.name)}">${ICONS.plus}</button></li>`;
  }
  flush();
  box.innerHTML = h;
}

/* ---------- действия ---------- */
function toast(msg, canUndo) {
  $('#toastMsg').textContent = msg;
  $('#undo').hidden = !canUndo;
  $('#toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').classList.remove('show'), canUndo ? 6000 : 2400);
}
const snapshot = () => { undoSnap = JSON.stringify(state); };

function createItem(raw, store, qty) {
  let name = String(raw).trim().replace(/\s+/g, ' ');
  if (!name) return { ok: false };
  name = name[0].toUpperCase() + name.slice(1);
  const dup = state.items.find(i => !i.done && i.store === store && i.name.toLowerCase() === name.toLowerCase());
  if (dup) return { ok: false, dup: true, name };
  const item = { id: uid(), name, qty: qty || '', store, done: false };
  state.items.push(item);
  return { ok: true, item, name };
}

function addItem(raw) {
  const store = pick && storeOf(pick) ? pick : null;
  const r = createItem(raw, store);
  if (r.dup) { toast(`«${r.name}» уже в списке`); return false; }
  if (!r.ok) return false;
  save(); render();
  const row = document.querySelector(`.row[data-id="${r.item.id}"]`);
  if (row) row.scrollIntoView({ block: 'nearest' });
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  return true;
}

function readd(name, storeName) {
  const st = state.stores.find(s => s.name === storeName);
  const r = createItem(name, st ? st.id : null);
  if (r.dup) { toast(`«${r.name}» уже в списке`); return; }
  if (!r.ok) return;
  save(); render();
  toast(`В списке: ${r.name}`);
}

function logPurchase(it) {
  const s = storeOf(it.store);
  state.log.push({ id: uid(), item: it.id, name: it.name, store: s ? s.name : null, color: s ? s.color : null, ts: Date.now() });
  if (state.log.length > LOG_MAX) state.log.splice(0, state.log.length - LOG_MAX);
}
function unlogPurchase(it) {
  for (let i = state.log.length - 1; i >= 0; i--) {
    if (state.log[i].item === it.id) { state.log.splice(i, 1); break; }
  }
}

function toggle(id, row) {
  const it = state.items.find(i => i.id === id);
  if (!it) return;
  it.done = !it.done;
  if (it.done) logPurchase(it); else unlogPurchase(it);
  save();
  row.classList.toggle('done', it.done);
  row.querySelector('.check').setAttribute('aria-pressed', it.done);
  // Строка остаётся на месте, чтобы следующий тап попал точно в нужный продукт.
  // Купленное уйдёт вниз при следующем обновлении списка.
  renderChrome();
  renderFilters();
  updateGroupCounts();
  renderClear();
}

function clearDone() {
  const ids = new Set();
  getGroups(state.view).forEach(g => g.items.forEach(i => { if (i.done) ids.add(i.id); }));
  if (!ids.size) return;
  snapshot();
  state.items = state.items.filter(i => !ids.has(i.id));
  save(); render();
  toast(`Убрано: ${ids.size}`, true);
}

function listText() {
  const lines = ['Список продуктов'];
  for (const g of getGroups('all')) {
    const items = g.items.filter(i => !i.done);
    if (!items.length) continue;
    lines.push('');
    if (g.name) lines.push(g.name + ':');
    items.forEach(i => lines.push('• ' + i.name + (i.qty ? ' (' + i.qty + ')' : '')));
  }
  return lines.join('\n');
}
async function shareList() {
  if (!state.items.some(i => !i.done)) { toast('Нечем делиться: список пуст'); return; }
  const text = listText();
  try {
    if (navigator.share) { await navigator.share({ text }); return; }
    await navigator.clipboard.writeText(text);
    toast('Список скопирован');
  } catch (e) { /* пользователь закрыл меню */ }
}

function setTab(t) {

  tab = t;

/* данные */
function stamp() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
async function exportData() {
  const json = JSON.stringify({ app: 'produkty', version: 2, exported: new Date().toISOString(), data: state }, null, 2);
  const name = `produkty-${stamp()}.json`;
  const file = new File([json], name, { type: 'text/plain' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Копия данных «Продукты»' });
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Копия сохранена');
}
async function importData(file) {
  try {
    const j = JSON.parse(await file.text());
    const d = j && j.data ? j.data : j;
    if (!d || !Array.isArray(d.items)) throw new Error('bad');
    snapshot();
    state = normalize(d);
    save(); render();
    toast('Данные восстановлены', true);
  } catch (e) {
    toast('Не удалось прочитать файл');
  }
}

/* ---------- события ---------- */
$('#add').addEventListener('submit', e => {
  e.preventDefault();
  const input = $('#item');
  if (addItem(input.value)) input.value = '';
  input.focus();
});

$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]');
  if (b) setTab(b.dataset.tab);
});

$('#acts').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'share') shareList();
  else if (b.dataset.act === 'stores') openStores(false);
  else if (b.dataset.act === 'newrecipe') openRecipeEdit(null);
});

$('#list').addEventListener('click', async e => {
  const rec = e.target.closest('[data-recipe]');
  if (rec) { openRecipe(rec.dataset.recipe); return; }
  const act = e.target.closest('[data-act]');
  if (act) {
    const a = act.dataset.act;
    if (a === 'edit') openEdit(act.closest('.row').dataset.id);
    else if (a === 'clear') clearDone();
    else if (a === 'tip') { try { localStorage.setItem(TIP_KEY, '1'); } catch (x) {} renderList(); }
    else if (a === 'newrecipe') openRecipeEdit(null);
    else if (a === 'readd') readd(act.dataset.name, act.dataset.store);
    else if (a === 'theme') { state.theme = act.dataset.v; save(); render(); }
    else if (a === 'export') exportData();
    else if (a === 'import') $('#importFile').click();
    else if (a === 'clearhist') {
      if (!state.log.length) { toast('История уже пуста'); return; }
      snapshot(); state.log = []; save(); render(); toast('История очищена', true);
    } else if (a === 'wipe') {
      if (await ask('Удалить все данные?', 'Список, магазины, рецепты и история будут удалены с этого телефона. Сразу после удаления это можно отменить.', 'Удалить')) {
        snapshot(); state = normalize({ theme: state.theme }); save(); render(); toast('Все данные удалены', true);
      }
    }
    return;
  }
  const row = e.target.closest('.row');
  if (row) toggle(row.dataset.id, row);
});

$('#filters').addEventListener('click', e => {
  const b = e.target.closest('[data-view]');
  if (!b) return;
  state.view = b.dataset.view;
  pick = (state.view === 'all' || state.view === 'none') ? null : state.view;
  save(); render();
});

$('#pick').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.act === 'newstore') { openStores(true); return; }
  if (b.dataset.store) { pick = pick === b.dataset.store ? null : b.dataset.store; renderPick(); }
});

$('#undo').addEventListener('click', () => {
  if (!undoSnap) return;
  state = normalize(JSON.parse(undoSnap));
  undoSnap = null;
  save(); render();
  $('#toast').classList.remove('show');
});

$('#importFile').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  e.target.value = '';
  if (f) importData(f);
});

/* лист «Продукт» */
$('#eStores').addEventListener('click', e => {
  const b = e.target.closest('[data-s]');
  if (!b) return;
  editStore = b.dataset.s || null;
  renderEditStores();
});
$('#editForm').addEventListener('submit', e => {
  e.preventDefault();
  const it = state.items.find(i => i.id === editingId);
  if (it) {
    const name = $('#eItem').value.trim().replace(/\s+/g, ' ');
    if (name) it.name = name;
    it.qty = $('#eQty').value.trim();
    it.store = editStore;
    save(); render();
  }
  editDlg.close();
});
$('#eDel').addEventListener('click', () => {
  const it = state.items.find(i => i.id === editingId);
  if (!it) { editDlg.close(); return; }
  snapshot();
  state.items = state.items.filter(i => i.id !== editingId);
  save(); render();
  editDlg.close();
  toast(`Удалено: ${it.name}`, true);
});

/* лист «Магазины» */
$('#storeForm').addEventListener('submit', e => {
  e.preventDefault();
  const input = $('#sShop');
  const name = input.value.trim().replace(/\s+/g, ' ');
  if (!name) return;
  if (state.stores.some(s => s.name.toLowerCase() === name.toLowerCase())) { toast('Такой магазин уже есть'); return; }
  const used = new Set(state.stores.map(s => s.color));
  const color = PALETTE.find(c => !used.has(c)) || PALETTE[state.stores.length % PALETTE.length];
  const store = { id: uid(), name: name[0].toUpperCase() + name.slice(1), color };
  state.stores.push(store);
  if (fromComposer) pick = store.id;
  input.value = '';
  save(); render(); renderStores();
  if (fromComposer) { storesDlg.close(); $('#item').focus(); }
});
$('#storeList').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const id = b.closest('.srow').dataset.id;
  const s = storeOf(id);
  if (!s) return;
  if (b.dataset.act === 'color') {
    s.color = PALETTE[(PALETTE.indexOf(s.color) + 1) % PALETTE.length];
    save(); render(); renderStores();
  } else if (b.dataset.act === 'del') {
    snapshot();
    state.stores = state.stores.filter(x => x.id !== id);
    state.items.forEach(i => { if (i.store === id) i.store = null; });
    if (pick === id) pick = null;
    save(); render(); renderStores();
    toast(`Магазин «${s.name}» удалён`, true);
  }
});
$('#storeList').addEventListener('change', e => {
  if (e.target.dataset.act !== 'rename') return;
  const s = storeOf(e.target.closest('.srow').dataset.id);
  const name = e.target.value.trim();
  if (s && name) { s.name = name; save(); render(); } else if (s) e.target.value = s.name;
});
$('#storesDone').addEventListener('click', () => storesDlg.close());

/* лист «Рецепт» */
$('#rIngs').addEventListener('change', updateRecipeBtn);
$('#rEdit').addEventListener('click', () => { const id = recipeId; recipeDlg.close(); openRecipeEdit(id); });
$('#rAdd').addEventListener('click', () => {
  const r = state.recipes.find(x => x.id === recipeId);
  if (!r) { recipeDlg.close(); return; }
  const ing = parseIngredients(r.text);
  let added = 0, dups = 0;
  $$('#rIngs input:checked').forEach(cb => {
    const x = ing[+cb.dataset.i];
    if (!x) return;
    const res = createItem(x.name, null, x.qty);
    if (res.ok) added++; else if (res.dup) dups++;
  });
  recipeDlg.close();
  if (!added && !dups) return;
  save();
  tab = 'list'; $('#main').scrollTop = 0; render();
  toast(added ? `Добавлено в список: ${added}` + (dups ? `, уже были: ${dups}` : '') : 'Всё это уже в списке');
});
$('#recipeForm').addEventListener('submit', e => {
  e.preventDefault();
  const title = $('#reTitle').value.trim().replace(/\s+/g, ' ');
  if (!title) return;
  const text = $('#reText').value.replace(/\r/g, '').trim();
  const r = state.recipes.find(x => x.id === recipeEditId);
  if (r) { r.title = title; r.text = text; }
  else state.recipes.unshift({ id: uid(), title, text });
  save(); render();
  recipeEditDlg.close();
});
$('#reDel').addEventListener('click', () => {
  const r = state.recipes.find(x => x.id === recipeEditId);
  if (!r) { recipeEditDlg.close(); return; }
  snapshot();
  state.recipes = state.recipes.filter(x => x.id !== recipeEditId);
  save(); render();
  recipeEditDlg.close();
  toast(`Рецепт «${r.title}» удалён`, true);
});

/* закрытие листа по тапу на фон */
[editDlg, storesDlg, recipeDlg, recipeEditDlg, confirmDlg].forEach(d =>
  d.addEventListener('click', e => { if (e.target === d) d.close(); }));

/* ---------- клавиатура: поведение iOS по умолчанию, без пересчёта размеров ---------- */
function fit() {
  const c = $('#add'), t = $('#tabs');
  const below = (c.hidden ? 0 : c.offsetHeight) + t.offsetHeight;
  document.documentElement.style.setProperty('--toast-b', (below + 10) + 'px');
}
window.addEventListener('resize', fit);
// Кнопка «+» не забирает фокус у поля: клавиатура остаётся открытой, можно добавлять подряд
$('.addbtn').addEventListener('mousedown', e => e.preventDefault());
$('#item').addEventListener('blur', () => setTimeout(() => {
  if (!document.activeElement || document.activeElement === document.body) window.scrollTo(0, 0);
}, 150));

/* ---------- запуск ---------- */
applyTheme();
render();
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) location.reload(); });
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
})();
</script>
</body>
</html>
